services:
  # 1. Database (PostgreSQL)
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: amivent_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. ASP.NET Backend (Hot Reload enabled)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Database=amivent_db;Username=user;Password=password
      - ASPNETCORE_ENVIRONMENT=Development
    volumes:
      - ./backend:/app
    working_dir: /app
    command: dotnet watch run
    depends_on:
      - db

  # 3. Next.js Frontend (Hot Reload enabled)
  frontend:
    build:
      context: ./frontend
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NEXT_PUBLIC_API_URL=http://localhost:5000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    working_dir: /app
    command: npm run dev
    depends_on:
      - backend

volumes:
  postgres_data: